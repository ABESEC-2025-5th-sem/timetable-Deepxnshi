<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Azamon</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #f3f3f3;
    }

    /* Navbar */
    .navbar {
      display: flex;
      align-items: center;
      background-color: #232f3e;
      padding: 10px 20px;
      color: white;
    }
    .logo {
      font-size: 24px;
      font-weight: bold;
      color: #ff9900;
      margin-right: auto;
    }
    .nav-links a {
      color: white;
      text-decoration: none;
      margin-left: 20px;
      font-size: 16px;
    }
    .nav-links a:hover {
      text-decoration: underline;
    }

    /* Product Section */
    .products {
      display: flex;
      justify-content: space-around;
      flex-wrap: wrap;
      padding: 40px 20px;
      background-color: #fff;
    }
    .product {
      width: 250px;
      margin: 20px;
      text-align: center;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      background-color: #ffffff;
      border-radius: 8px;
      padding: 15px;
    }
    .product img {
      width: 100%;
      height: auto;
      border-radius: 6px;
    }
    .product h3 {
      margin-top: 10px;
      font-size: 18px;
    }

    /* Footer */
    .footer {
      background-color: #232f3e;
      color: white;
      text-align: center;
      padding: 20px;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <div class="navbar">
    <div class="logo">Amazon</div>
    <div class="nav-links">
      <a href="#">Home</a>
      <a href="#">Cart</a>
      <a href="#">About</a>
    </div>
  </div>

  <!-- Product Section -->
  <div class="products">
    <div class="product">
      <img src="https://tse4.mm.bing.net/th/id/OIP.HHvFlRzBWUbKhXyC8HCMFgHaFj?pid=Api&P=0&h=180" alt="Rose">
      <h3>Red Rose</h3>
    </div>
    <div class="product">
      <img src="https://tse1.mm.bing.net/th/id/OIP.HKADtOXN2thLHouCqmvbNwHaFX?pid=Api&P=0&h=180" alt="Tulip">
      <h3>Yellow Tulip</h3>
    </div>
    <div class="product">
      <img src="https://tse1.mm.bing.net/th/id/OIP.vZn8a2w-GvHviaZdVkRRmQHaF2?pid=Api&P=0&h=180" alt="Sunflower">
      <h3>Sunflower</h3>
    </div>
  </div>

  <!-- Footer -->
  <div class="footer">
    &copy; copyright  ABES-DS,2025
  </div>

</body>
</html>
